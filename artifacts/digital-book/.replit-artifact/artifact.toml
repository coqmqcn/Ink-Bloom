kind = "web"
previewPath = "/"
title = "Digital Book Experience"
version = "1.0.0"
id = "artifacts/digital-book"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19345

[services.development]
run = "pnpm --filter @workspace/digital-book run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/digital-book", "run", "build" ]
publicDir = "artifacts/digital-book/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19345"
BASE_PATH = "/"
